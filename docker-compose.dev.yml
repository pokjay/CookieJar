# Dev overlay — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Builds images from source and mounts source code for hot-reload.
# New dependencies (pip/npm) require `make dev-rebuild` — a plain --build reuses
# the stale anonymous node_modules volume below.
services:
  # The scraper sidecar has no watch process, so it can't hot-reload like the
  # backend/frontend below — but building it from source here means `make dev`
  # picks up local scraper changes on rebuild instead of running the pulled
  # GHCR image. Edit src/ then re-run `make dev` (or `make dev-rebuild`).
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [".venv/bin/uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8083", "--reload"]
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      WATCHPACK_POLLING: "true"  # required for file-watching inside Docker on macOS
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules  # anonymous volume keeps container node_modules intact
    healthcheck:
      start_period: 60s  # next dev is slower to boot than the standalone production server
