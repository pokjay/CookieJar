[project]
name = "cookiejar"
version = "0.13.0"
description = "Family finance dashboard built with Next.js and FastAPI"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pykeepass>=4.1.0",
    "httpx>=0.27.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ipdb>=0.13.13",
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real PostgreSQL instance (set TEST_DATABASE_URL).",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
