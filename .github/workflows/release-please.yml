name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # uv.lock and frontend/package-lock.json each pin the root-package version
  # that release-please bumps in pyproject.toml / frontend/package.json, so a
  # release PR that only touched the manifests would fail `uv sync --locked`.
  # release-please-config.json lists both lockfiles as extra-files, making the
  # version bump land inside release-please's own commit — a follow-up job that
  # pushed a sync commit wouldn't work, because GITHUB_TOKEN-authored pushes
  # never re-trigger the PR's checks (see the same caveat in schema-check.yml).
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: ${{ fromJSON(needs.release-please.outputs.release_created) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
