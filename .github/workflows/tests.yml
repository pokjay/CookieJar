# Unit-test gate (#110): backend pytest + ruff, and the scraper sidecar's
# node:test suite (including the preparePage WAF-hardening browser test,
# which runs against the runner's preinstalled Chrome — REQUIRE_BROWSER_TESTS
# turns a missing browser into a hard failure instead of a silent skip).
#
# Deliberately NOT here: anything that talks to real bank sites. Those live
# in the scraper doctor script / scheduled probes (issue #110 part 1), which
# must never block merges.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

  scraper:
    name: Scraper sidecar (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    env:
      # israeli-bank-scrapers pulls puppeteer; never download a browser in CI —
      # the preparePage test uses the runner's preinstalled Chrome instead.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome for the preparePage hardening test
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm test
