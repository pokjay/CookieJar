name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    # Release PRs only bump version strings in the manifests and lockfiles —
    # there is no app behaviour to exercise, and the commits being released
    # already ran e2e on their own PRs and run it again on push to main.
    #
    # This has to be a job-level skip rather than a branch filter on `on:`.
    # e2e is a required status check: a workflow that never runs leaves it
    # pending forever and blocks the release PR from merging, whereas a skipped
    # job reports as satisfied. `head_ref` is empty on push, so main still runs.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Run E2E tests
        run: make e2e

      - name: Show db-seed logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.db.yml -f docker-compose.test.yml logs db-seed || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
